version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  animated_toggle_switch: ^0.8.2
  cupertino_icons: ^1.0.6
  easy_localization: ^3.0.7
  empty_widget:
    git:
      url: https://github.com/Pana-g/empty_widget
      ref: master
  flag: ^7.0.0
